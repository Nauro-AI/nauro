name: Publish nauro to PyPI

on:
  push:
    tags: ["nauro-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi-nauro
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv build --package nauro --python 3.12 --out-dir packages/nauro/dist
      - name: Smoke test the built wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheel_paths=("$GITHUB_WORKSPACE"/packages/nauro/dist/nauro-*.whl)
          if (( ${#wheel_paths[@]} != 1 )); then
            echo "expected one nauro wheel, found ${#wheel_paths[@]}" >&2
            exit 1
          fi
          smoke_root="$(mktemp -d "$RUNNER_TEMP/nauro-wheel-smoke.XXXXXX")"
          uv venv --python 3.12 "$smoke_root/venv"
          uv pip install --python "$smoke_root/venv/bin/python" "${wheel_paths[0]}"
          mkdir "$smoke_root/home" "$smoke_root/work"
          cd "$smoke_root/work"
          "$smoke_root/venv/bin/python" -c \
            'import nauro, os; from pathlib import Path; source = Path(nauro.__file__).resolve(); checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve(); assert checkout not in source.parents, source'
          env -u PYTHONPATH NAURO_HOME="$smoke_root/home" \
            "$smoke_root/venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_nauro_wheel_stdio.py" \
            "$smoke_root/venv/bin/nauro"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/nauro/dist/
          skip-existing: true

  publish-registry:
    needs: publish
    runs-on: ubuntu-latest
    environment: mcp-registry
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Verify server.json version matches the release tag
        run: |
          tag_version="${GITHUB_REF_NAME#nauro-v}"
          server_version="$(jq -r '.version' server.json)"
          package_version="$(jq -r '.packages[0].version' server.json)"
          if [ "$server_version" != "$tag_version" ]; then
            echo "server.json version ($server_version) does not match release tag ($tag_version)" >&2
            exit 1
          fi
          if [ "$package_version" != "$tag_version" ]; then
            echo "server.json packages[0].version ($package_version) does not match release tag ($tag_version)" >&2
            exit 1
          fi
          echo "server.json version $server_version matches release tag $tag_version"
      - name: Download mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Authenticate to the MCP registry via DNS
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain nauro.ai --private-key "$MCP_PRIVATE_KEY"
      - name: Publish server.json to the MCP registry
        run: ./mcp-publisher publish
