name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --package nauro --extra dev --python 3.12
      - run: uv run --no-sync ruff check packages/ benchmarks/ scripts/
      - run: uv run --no-sync ruff format --check packages/ benchmarks/ scripts/
      - run: uv run --no-sync python scripts/check_ruff_budget.py
      - run: uv run --no-sync python -m unittest discover -s scripts -p test_check_ruff_budget.py
      - run: >-
          uv run --no-sync mypy --disallow-untyped-defs --config-file packages/nauro/pyproject.toml
          packages/nauro/src/nauro/store/generation_authority.py
          packages/nauro/src/nauro/store/replica_control.py
          packages/nauro/src/nauro/store/generation_installation.py
          packages/nauro/src/nauro/store/generation_read.py
          packages/nauro/src/nauro/store/generation_store.py
          packages/nauro/src/nauro/mcp/generation_reads.py
          packages/nauro/src/nauro/mcp/generation_responses.py
          packages/nauro/src/nauro/mcp/resolution_errors.py
          packages/nauro/src/nauro/mcp/read_dispatch.py
          packages/nauro/src/nauro/mcp/state_responses.py
          packages/nauro/src/nauro/mcp/question_responses.py
          packages/nauro/src/nauro/store/read_authority.py
          packages/nauro/src/nauro/store/generation_refresh_state.py
          packages/nauro/src/nauro/store/generation_refresh_intent.py
          packages/nauro/src/nauro/store/generation_refresh_io.py
          packages/nauro/src/nauro/sync/generation_refresh.py
          packages/nauro/src/nauro/sync/generation_acquisition.py
          packages/nauro/src/nauro/store/submission_records.py
          packages/nauro/src/nauro/store/share_contract.py
          packages/nauro/src/nauro/store/share_records.py
          packages/nauro/src/nauro/sync/share_submission.py
          packages/nauro/src/nauro/sync/share_transport.py
          packages/nauro/src/nauro/mcp/share_responses.py
          packages/nauro/src/nauro/store/stack_contract.py
          packages/nauro/src/nauro/store/stack_records.py
          packages/nauro/src/nauro/sync/stack_submission.py
          packages/nauro/src/nauro/sync/stack_transport.py
          packages/nauro/src/nauro/mcp/stack_responses.py
          packages/nauro/src/nauro/store/state_contract.py
          packages/nauro/src/nauro/store/state_records.py
          packages/nauro/src/nauro/sync/state_submission.py
          packages/nauro/src/nauro/sync/state_transport.py
          packages/nauro/src/nauro/store/question_contract.py
          packages/nauro/src/nauro/store/question_records.py
          packages/nauro/src/nauro/sync/question_submission.py
          packages/nauro/src/nauro/sync/question_transport.py
          packages/nauro/src/nauro/sync/judgment_submission.py
          packages/nauro/src/nauro/sync/history_contract.py
          packages/nauro/src/nauro/sync/history_transport.py
          packages/nauro/src/nauro/sync/judgment_transport.py
          packages/nauro/src/nauro/sync/decision_reference.py
          packages/nauro/src/nauro/sync/decision_reference_contract.py
          packages/nauro/src/nauro/mcp/decision_reference.py
          packages/nauro/src/nauro/cli/decision_reference.py
          packages/nauro/src/nauro/sync/reference_reads.py
          packages/nauro/src/nauro/mcp/reference_reads.py
          packages/nauro/src/nauro/sync/reference_auth.py
          packages/nauro/src/nauro/sync/reference_credentials.py
          packages/nauro/src/nauro/sync/reference_oauth.py
          packages/nauro/src/nauro/sync/decision_profile.py
          packages/nauro/src/nauro/mcp/decision_reference_startup.py
          scripts/controlled_decision_reference.py
          packages/nauro/src/nauro/auth.py
          packages/nauro/src/nauro/sync/merge.py
          scripts/check_ruff_budget.py
      - run: python scripts/check_single_sourced.py packages/nauro/src
      - run: python scripts/check_docstring_budget.py packages/nauro/src packages/nauro-core/src
      - run: python scripts/check_server_json_version.py

  import-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked --package nauro-core --all-extras --python 3.12
      - run: uv run --no-sync --package nauro-core lint-imports
        working-directory: packages/nauro-core
      - run: uv sync --locked --package nauro --extra dev --python 3.12
      - run: uv run --no-sync --package nauro lint-imports
        working-directory: packages/nauro

  test-nauro-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --package nauro-core --all-extras --python ${{ matrix.python-version }}
      - run: uv run --no-sync --package nauro-core pytest packages/nauro-core/tests/ -v --tb=short

  test-nauro:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --package nauro --all-extras --python ${{ matrix.python-version }}
      - run: uv run --no-sync --package nauro pytest packages/nauro/tests/ --ignore=packages/nauro/tests/cross_surface -v --tb=short --junitxml=nauro-tests.xml
      - name: Require receipt refresh integration without skips
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PYTEST'
          import xml.etree.ElementTree as E
          cases = [case for case in E.parse("nauro-tests.xml").iter("testcase")
                   if case.get("classname", "").endswith("test_decision_receipt_refresh")]
          assert len(cases) == 10, len(cases)
          assert all(not list(case) for case in cases), "Receipt refresh proofs must pass without skips"
          contention = [case for case in E.parse("nauro-tests.xml").iter("testcase")
                        if case.get("classname", "").endswith("test_generation_refresh_contention")]
          assert len(contention) == 5, len(contention)
          assert all(not list(case) for case in contention), "Lock contention proofs must pass without skips"
          for module, count in (("test_generation_byte_reuse", 12), ("test_generation_refresh_reuse", 2)):
              reuse = [case for case in E.parse("nauro-tests.xml").iter("testcase")
                       if case.get("classname", "").endswith(module)]
              assert len(reuse) == count, (module, len(reuse))
              assert all(not list(case) for case in reuse), "Byte reuse proofs must pass without skips"
          PYTEST

  test-paired-server:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Require the server checkout token
        env:
          MCP_SERVER_READ_TOKEN: ${{ secrets.MCP_SERVER_READ_TOKEN }}
        run: |
          if [ -z "$MCP_SERVER_READ_TOKEN" ]; then
            echo "::error::MCP_SERVER_READ_TOKEN is not set. Add a read-only token for Nauro-AI/mcp-server as a repository secret; the paired server suites must run, not skip."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          path: client
      - uses: actions/checkout@v6
        with:
          repository: Nauro-AI/mcp-server
          ref: 4ff267d8cd38ead5ed80fbed9fee591aa6178f0d
          token: ${{ secrets.MCP_SERVER_READ_TOKEN }}
          path: server
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked --package nauro --all-extras --python 3.12
        working-directory: client
      - run: uv sync --locked --all-extras --python 3.12
        working-directory: server
      - name: Run installed client suites against the pinned server
        working-directory: client
        env:
          NAURO_SERVER_PYTHON: ${{ github.workspace }}/server/.venv/bin/python
          NAURO_SERVER_ROOT: ${{ github.workspace }}/server
        run: >-
          uv run --no-sync --package nauro pytest -q --tb=short --junitxml=../paired-client.xml
          packages/nauro/tests/test_history_paired.py
          packages/nauro/tests/test_question_transport_pair.py
          packages/nauro/tests/test_share_transport_pair.py
          packages/nauro/tests/test_stack_transport_pair.py
          packages/nauro/tests/test_state_transport_pair.py
      - name: Install the client into the server environment
        run: uv pip install --python server/.venv/bin/python -e client/packages/nauro-core -e client/packages/nauro
      - name: Run cross-surface parity against the pinned server store
        working-directory: client
        env:
          NAURO_S3_BUCKET: nauro-cross-surface-test
        run: ../server/.venv/bin/python -m pytest -q --tb=short --junitxml=../paired-cross.xml packages/nauro/tests/cross_surface
      - name: Run client integration suites inside the pinned server
        working-directory: server
        run: .venv/bin/python -m pytest -q --tb=short -c pyproject.toml --junitxml=../paired-integration.xml ../client/integration
      - name: Require every paired suite to pass without skips
        run: |
          python - <<'PY'
          import collections
          import xml.etree.ElementTree as E
          roots = [E.parse(name).getroot() for name in ("paired-client.xml", "paired-cross.xml", "paired-integration.xml")]
          counts = collections.Counter(case.get("classname", "").split(".")[-1] for root in roots for case in root.iter("testcase"))
          expected = {
              "test_history_paired": 7, "test_question_transport_pair": 4, "test_share_transport_pair": 4,
              "test_stack_transport_pair": 3, "test_state_transport_pair": 3,
              "test_check_decision_cross_surface": 6, "test_diff_since_last_session_cross_surface": 3,
              "test_flag_question_cross_surface": 5, "test_get_context_cross_surface": 3,
              "test_get_decision_cross_surface": 2, "test_get_raw_file_cross_surface": 2,
              "test_list_decisions_cross_surface": 2, "test_propose_decision_cross_surface": 4,
              "test_search_decisions_cross_surface": 2, "test_update_state_cross_surface": 4,
              "test_decision_reference_cli_server": 3, "test_decision_reference_server": 17,
              "test_decision_reference_startup_server": 2, "test_reference_auth_server": 2,
              "test_reference_reads_server": 1,
          }
          assert dict(counts) == expected, dict(counts)
          assert not any(list(root.iter(tag)) for root in roots for tag in ("skipped", "failure", "error")), "paired server suites must pass without skips"
          PY

  test-generation-control-platforms:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked --package nauro --all-extras --python 3.12
      - run: >-
          uv run --no-sync --package nauro pytest
          packages/nauro/tests/test_auth.py
          packages/nauro/tests/test_generation_authority.py
          packages/nauro/tests/test_generation_installation.py
          packages/nauro/tests/test_generation_read.py
          packages/nauro/tests/test_generation_store.py
          packages/nauro/tests/test_generation_reads.py
          packages/nauro/tests/test_generation_responses.py
          packages/nauro/tests/test_history_transport.py
          packages/nauro/tests/test_history_composition.py
          packages/nauro/tests/test_read_dispatch.py
          packages/nauro/tests/test_generation_refresh_state.py
          packages/nauro/tests/test_generation_refresh.py
          packages/nauro/tests/test_replica_control.py
          packages/nauro/tests/test_sync/test_generation_acquisition.py
          packages/nauro/tests/test_sync/test_submission_records_excluded.py
          packages/nauro/tests/test_sync/test_replica_control_excluded.py
          packages/nauro/tests/test_sync/test_push_admission.py
          packages/nauro/tests/test_sync/test_pull_admission.py
          packages/nauro/tests/test_sync/test_read_admission.py
          packages/nauro/tests/test_sync/test_restore_admission.py -v --tb=short

  test-sync-path-admission-windows-python310:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.10
      - run: uv sync --locked --package nauro --all-extras --python 3.10
      - run: >-
          uv run --no-sync --package nauro pytest
          packages/nauro/tests/test_sync/test_submission_records_excluded.py
          packages/nauro/tests/test_sync/test_replica_control_excluded.py
          packages/nauro/tests/test_sync/test_push_admission.py
          packages/nauro/tests/test_sync/test_pull_admission.py
          packages/nauro/tests/test_sync/test_read_admission.py
          packages/nauro/tests/test_sync/test_restore_admission.py -v --tb=short

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/nauro-build-env" \
            uv sync --locked --package nauro --extra dev --no-install-workspace --python 3.12
      - name: Build wheels from locked tooling
        run: |
          mkdir "$RUNNER_TEMP/nauro-wheel-build"
          uv build --package nauro-core --wheel --no-build-isolation \
            --python "$RUNNER_TEMP/nauro-build-env/bin/python" \
            --out-dir "$RUNNER_TEMP/nauro-wheel-build"
          uv build --package nauro --wheel --no-build-isolation \
            --python "$RUNNER_TEMP/nauro-build-env/bin/python" \
            --out-dir "$RUNNER_TEMP/nauro-wheel-build"
      - name: Smoke test the built wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheel_paths=("$RUNNER_TEMP"/nauro-wheel-build/nauro-*.whl)
          core_wheel_paths=("$RUNNER_TEMP"/nauro-wheel-build/nauro_core-*.whl)
          if (( ${#wheel_paths[@]} != 1 )); then
            echo "expected one nauro wheel, found ${#wheel_paths[@]}" >&2
            exit 1
          fi
          if (( ${#core_wheel_paths[@]} != 1 )); then
            echo "expected one nauro-core wheel, found ${#core_wheel_paths[@]}" >&2
            exit 1
          fi
          smoke_root="$(mktemp -d "$RUNNER_TEMP/nauro-wheel-smoke.XXXXXX")"
          smoke_env="$smoke_root/venv"
          requirements="$smoke_root/requirements.txt"
          uv export --quiet --locked --package nauro --no-dev --no-emit-workspace \
            --output-file "$requirements"
          uv venv --python 3.12 "$smoke_env"
          uv pip install --python "$smoke_env/bin/python" --require-hashes \
            --requirements "$requirements"
          uv pip install --python "$smoke_env/bin/python" --no-deps \
            "${core_wheel_paths[0]}" "${wheel_paths[0]}"
          wheel_name="$(basename "${wheel_paths[0]}")"
          core_wheel_name="$(basename "${core_wheel_paths[0]}")"
          expected_version="${wheel_name#nauro-}"
          expected_version="${expected_version%%-*}"
          expected_core_version="${core_wheel_name#nauro_core-}"
          expected_core_version="${expected_core_version%%-*}"
          mkdir "$smoke_root/home" "$smoke_root/work"
          cd "$smoke_root/work"
          EXPECTED_NAURO_VERSION="$expected_version" \
            EXPECTED_CORE_VERSION="$expected_core_version" \
            "$smoke_env/bin/python" -c \
            'import nauro, nauro_core, os; from importlib.metadata import version; from pathlib import Path; checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve(); sources = [Path(module.__file__).resolve() for module in (nauro, nauro_core)]; assert all(checkout not in source.parents for source in sources), sources; assert version("nauro") == os.environ["EXPECTED_NAURO_VERSION"]; assert version("nauro-core") == os.environ["EXPECTED_CORE_VERSION"]'
          env -u PYTHONPATH NAURO_HOME="$smoke_root/home" \
            "$smoke_env/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_nauro_wheel_stdio.py" \
            "$smoke_env/bin/nauro"
