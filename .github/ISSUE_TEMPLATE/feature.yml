name: Feature request
description: Describe a problem Nauro should solve.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not the solution. New commands, flags and setup targets stay until the next major version, so they need a real, observed need.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: Your current workaround, if any.
    validations:
      required: false
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
    validations:
      required: false
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options: ["No", "Yes, after we agree on an approach"]
    validations:
      required: true
