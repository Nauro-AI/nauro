[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nauro"
version = "1.22.1"
description = "What every agent should know. Keep your project's direction in human hands as agents do more of the work."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Thomas Thomsen"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "nauro-core>=1.17.0,<2",
    "typer>=0.9",
    "httpx>=0.24",
    "PyJWT[crypto]>=2.15,<3",
    "mcp>=1.0,<2",
    "filelock>=3.29.5",
    "tomli>=2.0; python_version<'3.11'",
    "tomlkit>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "hatchling",
    "pytest>=7.0",
    "ruff==0.15.20",
    "mypy==2.1.0",
    "import-linter==2.12",
    "jsonschema",
    "packaging",
]
embeddings = ["nauro-core[embeddings]"]

[project.urls]
Homepage = "https://github.com/nauro-ai/nauro"
Repository = "https://github.com/nauro-ai/nauro"
Issues = "https://github.com/nauro-ai/nauro/issues"

[project.scripts]
nauro = "nauro.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nauro"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/"]

[tool.uv.sources]
nauro-core = { workspace = true }

# Run mypy from the repository root: the files below resolve against the working directory.
[tool.mypy]
python_version = "3.10"
files = [
    "packages/nauro/src/nauro",
    "scripts/controlled_decision_reference.py",
    "scripts/check_ruff_budget.py",
]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# Modules that do not yet pass. This list may only shrink.
[[tool.mypy.overrides]]
module = [
    "nauro.cli._codex_hooks",
    "nauro.cli.autogen",
    "nauro.cli.commands.auth",
    "nauro.cli.commands.doctor",
    "nauro.cli.commands.graph",
    "nauro.cli.commands.hook",
    "nauro.cli.commands.import_cmd",
    "nauro.cli.commands.status",
    "nauro.cli.integrations.claude_hooks",
    "nauro.cli.integrations.codex_config",
    "nauro.cli.integrations.cursor",
    "nauro.graph.html_render",
    "nauro.mcp.stdio_server",
    "nauro.mcp.tools",
    "nauro.setup.render",
    "nauro.store.config",
    "nauro.store.decision_lock",
    "nauro.store.registry",
    "nauro.store.snapshot",
    "nauro.store.store_lock",
    "nauro.sync.lock",
    "nauro.sync.push",
    "nauro.sync.remote",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
